[project]
name = "odysseus-capability-kit"
version = "0.1.0"
description = "Shared contracts for Odysseus capability workers: model-broker client, v1 run-lifecycle protocol, bearer auth, user-agent policy"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
worker = [
    "fastapi>=0.110",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capability_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
