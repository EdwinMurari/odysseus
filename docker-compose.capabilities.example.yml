# Optional Compose overlay for isolated repository capabilities.
#
# Expected directory layout:
#   <build-root>/odysseus
#   <build-root>/pain-miner
#   <build-root>/stock-research
services:
  odysseus:
    environment:
      - PAIN_MINER_CAPABILITY_TOKEN=${PAIN_MINER_CAPABILITY_TOKEN:?set PAIN_MINER_CAPABILITY_TOKEN}
      - STOCK_RESEARCH_CAPABILITY_TOKEN=${STOCK_RESEARCH_CAPABILITY_TOKEN:?set STOCK_RESEARCH_CAPABILITY_TOKEN}
      - ODYSSEUS_CAPABILITY_MODEL_TOKEN=${ODYSSEUS_CAPABILITY_MODEL_TOKEN:?set ODYSSEUS_CAPABILITY_MODEL_TOKEN}
    depends_on:
      pain-miner-capability:
        condition: service_started
      stock-research-capability:
        condition: service_started

  pain-miner-capability:
    build:
      context: ${ODYSSEUS_CAPABILITY_BUILD_ROOT:-..}
      dockerfile: odysseus/docker/capability-worker.Dockerfile
      args:
        CAPABILITY_PROJECT: pain-miner
    environment:
      - CAPABILITY_TOKEN=${PAIN_MINER_CAPABILITY_TOKEN:?set PAIN_MINER_CAPABILITY_TOKEN}
      - CAPABILITY_COMMAND_JSON=["painminer","run"]
      - CAPABILITY_INPUTS_JSON={"since":{"type":"string","default":"7d","flag":"--since"},"sources":{"type":"string","default":"hn,reddit,austender,austender_ocds,g2,github,appstore,stackexchange,bluesky,rss","flag":"--sources"},"report":{"type":"string","default":"/data/reports/pain-miner.md","flag":"--report"},"refresh":{"type":"boolean","default":true,"flag":"--refresh","false_flag":"--no-refresh"},"max_items":{"type":"integer","flag":"--max-items"}}
      - CAPABILITY_PASS_ENV_JSON=["DATABASE_URL","APIFY_TOKEN","REDDIT_CLIENT_ID","REDDIT_CLIENT_SECRET","REDDIT_USER_AGENT","DIGEST_DIR","PAINMINER_CONFIG","PAINMINER_REPORT_ROOTS_JSON","PAINMINER_LLM_MODE","ODYSSEUS_MODEL_BROKER_URL","ODYSSEUS_CAPABILITY_MODEL_TOKEN","PAINMINER_TAG_MODEL_ROLE","PAINMINER_CLUSTER_MODEL_ROLE"]
      - CAPABILITY_READINESS_JSON={"apify":{"env":["APIFY_TOKEN"],"missing_message":"G2 collection is unavailable."},"reddit":{"env":["REDDIT_CLIENT_ID","REDDIT_CLIENT_SECRET","REDDIT_USER_AGENT"],"missing_message":"Reddit collection is unavailable."}}
      - CAPABILITY_TIMEOUT_SECONDS=1800
      - CAPABILITY_REPORT_ROOTS_JSON=["/data/reports"]
      - DATABASE_URL=postgresql://painminer:painminer@pain-miner-postgres:5432/painminer
      - APIFY_TOKEN=${APIFY_TOKEN:-}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID:-}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET:-}
      - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-}
      - DIGEST_DIR=/data/reports
      - PAINMINER_CONFIG=/capability/config.yaml
      - PAINMINER_REPORT_ROOTS_JSON=["/data/reports"]
      - PAINMINER_LLM_MODE=odysseus
      - ODYSSEUS_MODEL_BROKER_URL=http://odysseus:7000
      - ODYSSEUS_CAPABILITY_MODEL_TOKEN=${ODYSSEUS_CAPABILITY_MODEL_TOKEN:?set ODYSSEUS_CAPABILITY_MODEL_TOKEN}
      - PAINMINER_TAG_MODEL_ROLE=painminer.tag
      - PAINMINER_CLUSTER_MODEL_ROLE=painminer.cluster
    volumes:
      - pain-miner-runs:/data/runs
      - pain-miner-reports:/data/reports
    depends_on:
      pain-miner-postgres:
        condition: service_healthy
    restart: unless-stopped

  pain-miner-postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=painminer
      - POSTGRES_PASSWORD=painminer
      - POSTGRES_DB=painminer
    volumes:
      - pain-miner-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painminer"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  stock-research-capability:
    # Native FastAPI worker (implements /v1/runs + /v1/readiness itself),
    # so it builds from its own Dockerfile rather than the generic
    # capability-worker image. Secrets live ONLY in this container; the
    # registry uses `probe: worker` to surface their status in the UI.
    build:
      context: ${ODYSSEUS_CAPABILITY_BUILD_ROOT:-..}/stock-research
      dockerfile: Dockerfile
    environment:
      - STOCK_RESEARCH_CAPABILITY_TOKEN=${STOCK_RESEARCH_CAPABILITY_TOKEN:?set STOCK_RESEARCH_CAPABILITY_TOKEN}
      - EDGAR_USER_AGENT=${EDGAR_USER_AGENT:?set EDGAR_USER_AGENT as "name email"}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - FINRA_CLIENT_ID=${FINRA_CLIENT_ID:-}
      - FINRA_CLIENT_SECRET=${FINRA_CLIENT_SECRET:-}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID:-}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET:-}
      - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-}
      - STOCK_RESEARCH_DATA_DIR=/data
      - HF_HOME=/data/models
      - ODYSSEUS_MODEL_BROKER_URL=http://odysseus:7000
      - ODYSSEUS_CAPABILITY_MODEL_TOKEN=${ODYSSEUS_CAPABILITY_MODEL_TOKEN:?set ODYSSEUS_CAPABILITY_MODEL_TOKEN}
      - STOCK_RESEARCH_SUMMARIZE_MODEL_ROLE=stockresearch.summarize
      - STOCK_RESEARCH_DEEPDIVE_MODEL_ROLE=stockresearch.deepdive
    volumes:
      - stock-research-data:/data
    restart: unless-stopped

volumes:
  pain-miner-runs:
  pain-miner-reports:
  pain-miner-postgres:
  stock-research-data:
