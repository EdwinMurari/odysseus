version: 1

# Copy this file to data/capabilities.yaml. In Docker, HTTP capabilities are
# recommended because each task engine keeps its own dependencies and runtime.
model_roles:
  painminer.tag:
    setting_prefix: utility
    capabilities: [pain-miner]
    max_tokens: 2048
  painminer.cluster:
    setting_prefix: default
    capabilities: [pain-miner]
    max_tokens: 8192

capabilities:
  - id: pain-miner
    name: Pain Miner
    description: Build the weekly paid-pain digest.
    version: "1"
    implementation: painminer.pipeline
    enabled: true
    admin_only: true
    timeout_seconds: 1800
    import_report: true
    triggers: [manual, schedule]
    presentation:
      icon: radar
      category: Market Intelligence
      short_description: Find recurring, monetizable customer pain from live evidence.
      documentation_url: /docs/capabilities#pain-miner
    dependencies:
      - id: apify
        label: Apify
        kind: integration
        probe: worker
        env: APIFY_TOKEN
        required: false
        input: sources
        values: [g2]
        required_when_selected: true
        missing_message: G2 collection is unavailable.
      - id: reddit
        label: Reddit API
        kind: integration
        probe: worker
        env: REDDIT_CLIENT_ID
        required: false
        input: sources
        values: [reddit]
        required_when_selected: true
        missing_message: Reddit collection is unavailable.
      - id: hn
        label: Hacker News
        kind: integration
        required: false
        input: sources
        values: [hn]
        missing_message: Hacker News is always available (public API).
      - id: austender
        label: AusTender
        kind: integration
        required: false
        input: sources
        values: [austender]
        missing_message: AusTender is always available (public API).
      - id: austender_ocds
        label: AusTender OCDS
        kind: integration
        required: false
        input: sources
        values: [austender_ocds]
        missing_message: AusTender OCDS is always available (public API).
      - id: github
        label: GitHub Issues
        kind: integration
        required: false
        input: sources
        values: [github]
        missing_message: GitHub Issues is always available (public API).
      - id: appstore
        label: App Store
        kind: integration
        required: false
        input: sources
        values: [appstore]
        missing_message: App Store reviews is always available (public API).
      - id: stackexchange
        label: Stack Exchange
        kind: integration
        required: false
        input: sources
        values: [stackexchange]
        missing_message: Stack Exchange is always available (public API).
      - id: bluesky
        label: Bluesky
        kind: integration
        required: false
        input: sources
        values: [bluesky]
        missing_message: Bluesky is always available (public API).
      - id: rss
        label: RSS Feeds
        kind: integration
        required: false
        input: sources
        values: [rss]
        missing_message: RSS feeds is always available (public feeds).
    progress_phases: [collect, tag, cluster, report]
    idempotent: true
    transport:
      type: http
      base_url: http://pain-miner-capability:8080
      token_env: PAIN_MINER_CAPABILITY_TOKEN
    inputs:
      since:
        type: string
        label: Lookback
        group: Evidence
        description: Lookback window accepted by painminer, such as 7d.
        default: 7d
      sources:
        type: array
        label: Sources
        group: Evidence
        description: Select the sources to include in this run.
        default: [hn, reddit, austender, austender_ocds, g2, github, appstore, stackexchange, bluesky, rss]
      refresh:
        type: boolean
        label: Refresh sources
        group: Evidence
        description: Refresh external sources before analysis.
        default: true
      max_items:
        type: integer
        label: Maximum items
        group: Advanced
        advanced: true
        minimum: 1
        description: Optional cap used for source collection and tagging.

  # Trusted native-install example. Commands are argv arrays, never shell text.
  # This mode is not recommended inside the Odysseus container because every
  # repository would have to share that container's dependency environment.
  - id: example-native-report
    name: Example Native Report
    description: Demonstrates the process transport for non-Docker installs.
    admin_only: true
    timeout_seconds: 600
    import_report: true
    transport:
      type: process
      cwd: /absolute/path/to/example-repo
      command: ["/absolute/path/to/example-repo/.venv/bin/example", "report"]
      pass_env: ["EXAMPLE_API_KEY"]
    inputs:
      watchlist:
        type: string
        flag: --watchlist
        required: true
        description: Named watchlist to analyse.
      include_news:
        type: boolean
        flag: --include-news
        default: true
