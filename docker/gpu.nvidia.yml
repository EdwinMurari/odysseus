# NVIDIA GPU overlay. Enable by setting COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/gpu.nvidia.yml
#
# Use scripts/check-docker-gpu.sh to diagnose GPU passthrough, optionally
# install the NVIDIA Container Toolkit (Ubuntu/Debian), and write COMPOSE_FILE
# to .env. The script is read-only by default — it installs nothing and never
# edits .env unless explicitly asked.
#
# Requires the NVIDIA Container Toolkit on the host.
#   Arch:    sudo pacman -S nvidia-container-toolkit
#   Debian:  sudo apt install nvidia-container-toolkit
#   Fedora:  sudo dnf install nvidia-container-toolkit
# Then:
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
# Verify with:
#   docker info | grep -i nvidia
#
# This overlay only passes the host GPU through to the container.
# The slim Odysseus image does not bundle CUDA userspace or inference
# engines — install vLLM / llama-cpp-python / SGLang via
# Cookbook -> Dependencies (or pip) before serving GPU models.
services:
  odysseus:
    # Bake a CUDA llama-server into the image at build time (multi-stage in the
    # Dockerfile). With this, Cookbook's first llama.cpp serve finds the binary
    # on PATH and skips the slow, fragile from-source build that otherwise runs
    # on every container recreate. LLAMA_CUDA_ARCH=86 targets Ampere / RTX
    # 30-series; override for other cards (Ada=89, Hopper=90, Turing=75).
    # Context/dockerfile are inherited from docker-compose.yml's `build: .`
    # (resolved against that file's dir); we only add build args here so the
    # path stays unambiguous when the two files are merged.
    build:
      args:
        LLAMA_CUDA: "on"
        LLAMA_CUDA_ARCH: "86"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
